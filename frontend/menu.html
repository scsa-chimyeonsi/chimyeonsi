<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>침연시 - 메인 메뉴</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h1 class="page-title">침연시</h1>
        <p id="greeting" class="page-subtitle"></p>

        <div id="continueSection" class="hidden">
            <div style="background:#0f172a; border:1px solid #334155; border-radius:0.75rem; padding:1rem; margin-bottom:1.5rem;">
                <p class="text-sm text-muted" style="margin-bottom:0.25rem;">진행 중인 게임</p>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                    <span id="stepInfo" style="font-weight:600; color:#f1f5f9;"></span>
                    <span id="scoreInfo" class="badge badge-indigo"></span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill" style="width:0%"></div>
                </div>
            </div>
            <button id="continueBtn" class="btn btn-primary" style="margin-bottom:0.75rem;">이어하기</button>
        </div>

        <button id="newGameBtn" class="btn btn-secondary" style="margin-bottom:0.75rem;">새 게임 시작</button>
        <button id="summaryBtn" class="btn btn-secondary hidden" style="margin-bottom:0.75rem;">결과 보기</button>

        <hr class="divider">

        <button id="logoutBtn" class="btn" style="background:transparent; color:#64748b; border:1px solid #334155;">
            로그아웃
        </button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (!Auth.requireLogin()) throw new Error('not logged in');

        const userId = Auth.getUserId();
        document.getElementById('greeting').textContent = `${Auth.getNickname()}님, 안녕하세요!`;

        (async () => {
            try {
                const state = await api.getPlayState(userId);
                if (state.exists) {
                    document.getElementById('continueSection').classList.remove('hidden');
                    document.getElementById('stepInfo').textContent =
                        `${state.current_step} / ${state.total_steps} 단계`;
                    document.getElementById('scoreInfo').textContent = `${state.total_score}점`;
                    const pct = Math.round((state.current_step - 1) / state.total_steps * 100);
                    document.getElementById('progressFill').style.width = pct + '%';

                    if (state.current_step > state.total_steps) {
                        document.getElementById('summaryBtn').classList.remove('hidden');
                    }
                }
            } catch {}
        })();

        document.getElementById('continueBtn').addEventListener('click', () => {
            location.href = 'game.html';
        });

        document.getElementById('newGameBtn').addEventListener('click', async () => {
            if (!confirm('새 게임을 시작하면 기존 진행 상황이 초기화됩니다. 계속하시겠습니까?')) return;
            try {
                await api.createOrResetPlayState(userId);
                location.href = 'game.html';
            } catch (err) {
                alert(err.message);
            }
        });

        document.getElementById('summaryBtn').addEventListener('click', () => {
            location.href = 'result.html';
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            Auth.clear();
            location.href = 'index.html';
        });
    </script>
</body>
</html>
