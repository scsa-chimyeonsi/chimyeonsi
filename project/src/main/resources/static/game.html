<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>침연시 - 게임</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cursor {
            display: inline-block;
            width: 2px; height: 1em;
            background: #6366f1;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.7s step-end infinite;
        }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

        .option-btn.selected-good {
            border-color: #22c55e;
            background-color: rgba(34,197,94,0.08);
            color: #86efac;
        }
        .option-btn.selected-bad {
            border-color: #ef4444;
            background-color: rgba(239,68,68,0.08);
            color: #fca5a5;
        }
        .option-btn:disabled { opacity: 0.55; cursor: not-allowed; }

        #sceneImg {
            width: 100%; max-height: 220px;
            object-fit: cover;
            border-radius: 0.75rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        #sceneImg.loaded { display: block; }

        @keyframes shake {
            0%,100%{ transform:translateX(0); }
            20%    { transform:translateX(-7px); }
            40%    { transform:translateX(7px); }
            60%    { transform:translateX(-4px); }
            80%    { transform:translateX(4px); }
        }
        .shake { animation: shake 0.35s ease; }

        .score-delta {
            margin-left: auto;
            font-size: 0.85rem;
            font-weight: 700;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
<div class="card card-wide">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem;">
        <span id="stepBadge" class="badge badge-indigo"></span>
        <span id="scoreBadge" class="text-muted text-sm"></span>
    </div>
    <div class="progress-bar" style="margin-bottom:1.5rem;">
        <div id="progressFill" class="progress-fill" style="width:0%"></div>
    </div>

    <img id="sceneImg" alt="시나리오 이미지" />

    <div style="background:#0f172a; border-radius:0.75rem; padding:1.5rem;
                    margin-bottom:1.75rem; border:1px solid #334155; min-height:140px; line-height:1.8;">
        <p id="scenarioContent" style="color:#cbd5e1; white-space:pre-wrap;"></p>
    </div>

    <div id="options">
        <button id="optA" class="option-btn" style="display:flex; align-items:flex-start;">
            <span class="opt-label">A</span>
            <span id="optAText" style="flex:1;"></span>
        </button>
        <button id="optB" class="option-btn" style="display:none; align-items:flex-start;">
            <span class="opt-label">B</span>
            <span id="optBText" style="flex:1;"></span>
        </button>
    </div>

    <div id="resultBox" class="alert hidden" style="margin-top:1rem;"></div>
    <div id="loadingBox" class="hidden text-center text-muted text-sm"
         style="margin-top:1rem; padding:0.5rem;">⏳ 불러오는 중...</div>

    <hr class="divider">
    <button onclick="location.href='menu.html'" class="link text-sm"
            style="background:none; border:none; cursor:pointer; padding:0;">
        ← 메뉴로 돌아가기
    </button>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
    if (!Auth.requireLogin()) throw new Error('not logged in');

    const userId = Auth.getUserId();
    let currentScenarioId = null;
    let isTyping = false;

    const elStep     = document.getElementById('stepBadge');
    const elScore    = document.getElementById('scoreBadge');
    const elProgress = document.getElementById('progressFill');
    const elContent  = document.getElementById('scenarioContent');
    const elOptA     = document.getElementById('optA');
    const elOptB     = document.getElementById('optB');
    const elOptAText = document.getElementById('optAText');
    const elOptBText = document.getElementById('optBText');
    const elResult   = document.getElementById('resultBox');
    const elLoading  = document.getElementById('loadingBox');
    const elImg      = document.getElementById('sceneImg');

    function setOptionsDisabled(on) {
        elOptA.disabled = on;
        elOptB.disabled = on;
    }

    function showResult(type, msg) {
        elResult.textContent = msg;
        elResult.className = `alert ${type === 'error' ? 'alert-error' : 'alert-success'}`;
        elResult.classList.remove('hidden');
    }

    function hideResult() { elResult.classList.add('hidden'); }
    function setLoading(on) { elLoading.classList.toggle('hidden', !on); }

    function updateHUD(step, score) {
        elStep.textContent  = `${step} 단계`;
        elScore.textContent = `현재 점수: ${score}점`;
        const pct = Math.min(Math.round((step - 1) / 4 * 100), 100);
        elProgress.style.width = pct + '%';
    }

    function loadSceneImage(scenarioId) {
        elImg.classList.remove('loaded');
        const exts = ['jpg', 'jpeg', 'png', 'webp'];
        let tried = 0;
        function tryNext() {
            if (tried >= exts.length) return;
            elImg.src = `images/scenario_${scenarioId}.${exts[tried++]}`;
        }
        elImg.onload  = () => elImg.classList.add('loaded');
        elImg.onerror = tryNext;
        tryNext();
    }

    function typeText(el, text, speed = 25) {
        return new Promise(resolve => {
            isTyping = true;
            el.innerHTML = '';
            let i = 0;
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            el.appendChild(cursor);
            const tick = () => {
                if (i < text.length) {
                    cursor.before(text[i++]);
                    setTimeout(tick, speed);
                } else {
                    cursor.remove();
                    isTyping = false;
                    resolve();
                }
            };
            tick();
        });
    }

    async function renderScenario(scenarioId, content, optAText, optBText, step, score) {
        currentScenarioId = scenarioId;
        updateHUD(step, score);
        loadSceneImage(scenarioId);

        elOptAText.textContent = optAText || '';
        elOptBText.textContent = optBText || '';

        // B 텍스트 없거나 '-' 면 숨기기
        const hasBOption = optBText && optBText.trim() !== '' && optBText.trim() !== '-';
        elOptA.style.display = 'flex';
        elOptB.style.display = hasBOption ? 'flex' : 'none';

        elOptA.className = 'option-btn';
        elOptB.className = 'option-btn';
        elOptA.querySelector('.score-delta')?.remove();
        elOptB.querySelector('.score-delta')?.remove();

        setOptionsDisabled(true);
        hideResult();

        await typeText(elContent, content);
        setOptionsDisabled(false);
    }

    async function loadFirstScenario() {
        setLoading(true);
        try {
            const data = await api.getCurrentScenario(userId);
            const s = data.scenario;
            await renderScenario(
                s.scenario_id,
                s.content,
                s.opt_a_text,
                s.opt_b_text,
                data.current_step,
                data.total_score
            );
        } catch (err) {
            showResult('error', '시나리오를 불러오지 못했습니다: ' + err.message);
        } finally {
            setLoading(false);
        }
    }

    async function selectOption(opt) {
        if (isTyping) return;
        setOptionsDisabled(true);
        hideResult();

        try {
            const data = await api.submitOption(userId, {
                scenarioId: currentScenarioId,
                selectedOpt: opt,
            });

            const isGood   = data.scoreChange >= 0;
            const chosenEl = opt === 'A' ? elOptA : elOptB;

            chosenEl.classList.add(isGood ? 'selected-good' : 'selected-bad');

            const delta = document.createElement('span');
            delta.className   = 'score-delta';
            delta.style.color = isGood ? '#86efac' : '#fca5a5';
            delta.textContent = (isGood ? '+' : '') + data.scoreChange + '점';
            chosenEl.appendChild(delta);

            if (!isGood) {
                const card = document.querySelector('.card');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }

            showResult('success',
                `${isGood ? '✅' : '❌'} ${isGood ? '+' : ''}${data.scoreChange}점  |  총점: ${data.totalScore}점`
            );

            await new Promise(r => setTimeout(r, 1000));

            if (data.resultType === 'CONTINUE') {
                const next = data.nextScenario;
                await renderScenario(
                    next.scenarioId,
                    next.content,
                    next.optAText ?? '',
                    next.optBText ?? '',
                    data.currentStep,
                    data.totalScore
                );
            } else {
                location.href = 'result.html';
            }

        } catch (err) {
            showResult('error', '선택을 처리하지 못했습니다: ' + err.message);
            setOptionsDisabled(false);
        }
    }

    elOptA.addEventListener('click', () => selectOption('A'));
    elOptB.addEventListener('click', () => selectOption('B'));

    loadFirstScenario();
</script>
</body>
</html>
