<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>침연시 - 로그인</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h1 class="page-title">침연시</h1>
        <p class="page-subtitle">당신의 선택이 결말을 바꿉니다</p>

        <div id="alert" class="alert alert-error hidden"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" id="email" class="form-input" placeholder="example@email.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" id="password" class="form-input" placeholder="비밀번호 입력" required>
            </div>
            <button type="submit" class="btn btn-primary mt-4">로그인</button>
        </form>

        <hr class="divider">

        <p class="text-center text-muted">
            계정이 없으신가요?
            <a href="register.html" class="link">회원가입</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (Auth.isLoggedIn()) location.href = 'menu.html';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertEl = document.getElementById('alert');
            alertEl.classList.add('hidden');

            const email    = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const data = await api.login({ email, password });
                Auth.save(data.user_id, data.nickname);
                location.href = 'menu.html';
            } catch (err) {
                alertEl.textContent = err.message;
                alertEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
