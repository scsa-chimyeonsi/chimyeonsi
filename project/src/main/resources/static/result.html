<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>침연시 - 결과</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card card-wide">
        <!-- 엔딩 헤더 -->
        <div style="text-align:center; margin-bottom:1.75rem;">
            <span id="endingBadge" class="badge" style="font-size:0.8125rem; margin-bottom:0.75rem;"></span>
            <h1 id="endingTitle" class="page-title" style="margin-bottom:0.25rem;"></h1>
            <p id="endingMessage" class="page-subtitle" style="margin-bottom:0.25rem;"></p>
            <!-- Ending image (place images in /static/images/) -->
            <img id="endingImage" src="" alt="ending image" style="width:100%; max-height:300px; object-fit:cover; border-radius:0.5rem; margin:0.75rem 0;">
            <p id="scenarioMessage" style="color:#94a3b8; font-size:0.9rem; font-style:italic; margin-top:0.5rem;"></p>
        </div>

        <!-- 점수 요약 -->
        <div style="display:flex; gap:1rem; margin-bottom:1.75rem; text-align:center;">
            <div style="flex:1; background:#0f172a; border:1px solid #334155;
                        border-radius:0.75rem; padding:1rem;">
                <p class="text-muted text-sm">최종 점수</p>
                <p id="finalScore" style="font-size:1.75rem; font-weight:700; color:#a5b4fc;"></p>
            </div>
            <div style="flex:1; background:#0f172a; border:1px solid #334155;
                        border-radius:0.75rem; padding:1rem;">
                <p class="text-muted text-sm">A 선택</p>
                <p id="optACount" style="font-size:1.75rem; font-weight:700; color:#e2e8f0;"></p>
            </div>
            <div style="flex:1; background:#0f172a; border:1px solid #334155;
                        border-radius:0.75rem; padding:1rem;">
                <p class="text-muted text-sm">B 선택</p>
                <p id="optBCount" style="font-size:1.75rem; font-weight:700; color:#e2e8f0;"></p>
            </div>
        </div>

        <!-- 타임라인 -->
        <h2 style="font-size:1rem; font-weight:600; color:#94a3b8;
                   margin-bottom:0.75rem; text-transform:uppercase; letter-spacing:0.05em;">
            선택 타임라인
        </h2>
        <div id="timeline" style="max-height:320px; overflow-y:auto;"></div>

        <hr class="divider">

        <div style="display:flex; gap:0.75rem;">
            <button id="retryBtn" class="btn btn-primary">다시 하기</button>
            <a href="menu.html" class="btn btn-secondary" style="text-decoration:none;">메뉴로</a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (!Auth.requireLogin()) throw new Error('not logged in');

        const userId = Auth.getUserId();

        (async () => {
            try {
                const [ending, summary] = await Promise.all([
                    api.getEnding(userId),
                    api.getSummary(userId),
                ]);

                const isGameOver = ending.ending_type === 'GAME_OVER';
                const isEnding = ending.ending_type === 'ENDING';

                // Special ending detection: check scenario message from server or timeline content
                const scenarioMsg = ending.scenario_message || '';
                const timelineIncludesSpecial = (summary.timeline || []).some(i => i.content && i.content.includes('김풍'));
                const isSpecial = scenarioMsg.includes('김풍') || timelineIncludesSpecial;

                const badge = document.getElementById('endingBadge');
                if (isSpecial) {
                    badge.textContent = '스페셜 엔딩';
                    badge.classList.add('badge-yellow');
                } else {
                    badge.textContent = isGameOver ? '게임 오버' : '해피 엔딩';
                    badge.classList.add(isGameOver ? 'badge-red' : 'badge-indigo');
                }

                // select image based on ending type
                let imageSrc = '/images/happy_ending.jpg';
                if (isSpecial) {
                    imageSrc = '/images/special_ending.jpg';
                } else if (isGameOver) {
                    imageSrc = '/images/bad_ending.jpg';
                } else if (isEnding) {
                    imageSrc = '/images/happy_ending.jpg';
                }

                const imgEl = document.getElementById('endingImage');
                if (imgEl) {
                    imgEl.src = imageSrc;
                    imgEl.alt = isSpecial ? 'Special Ending' : (isGameOver ? 'Bad Ending' : 'Happy Ending');
                }

                // title/message overrides for special ending
                if (isSpecial) {
                    document.getElementById('endingTitle').textContent = '침착맨은 매력적인 김풍을 거부할 수 없었다...';
                    document.getElementById('endingMessage').textContent = ending.ending_message || '침착맨은 매력적인 김풍을 거부할 수 없었다...';
                } else {
                    document.getElementById('endingTitle').textContent   = (ending.ending_title || (isGameOver ? '게임 오버' : '침착맨은 당신에게 반한 듯하다'));
                    document.getElementById('endingMessage').textContent = ending.ending_message || '';
                }

                document.getElementById('scenarioMessage').textContent = ending.scenario_message || '';
                document.getElementById('finalScore').textContent    = ending.final_score + '점';
                document.getElementById('optACount').textContent     = ending.opt_a_count + '회';
                document.getElementById('optBCount').textContent     = ending.opt_b_count + '회';

                const timeline = document.getElementById('timeline');
                (summary.timeline || []).forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'timeline-item';
                    div.innerHTML = `
                        <div class="timeline-step">${item.step_order}</div>
                        <div class="timeline-content">
                            <p style="font-size:0.875rem; color:#cbd5e1; margin-bottom:0.25rem;">
                                ${item.content}
                            </p>
                            <p style="font-size:0.8rem;">
                                <span class="badge badge-indigo" style="margin-right:0.25rem;">
                                    ${item.selected_opt}
                                </span>
                                <span style="color:#94a3b8;">${item.selected_text}</span>
                                <span style="color:${item.score_change >= 0 ? '#86efac' : '#fca5a5'};
                                             margin-left:0.5rem; font-weight:600;">
                                    ${item.score_change >= 0 ? '+' : ''}${item.score_change}점
                                </span>
                            </p>
                        </div>
                    `;
                    timeline.appendChild(div);
                });
            } catch (err) {
                document.getElementById('endingTitle').textContent = '결과를 불러오지 못했습니다.';
                document.getElementById('endingMessage').textContent = err.message;
            }
        })();

        document.getElementById('retryBtn').addEventListener('click', async () => {
            if (!confirm('새 게임을 시작하면 기존 진행 상황이 초기화됩니다. 계속하시겠습니까?')) return;
            try {
                await api.createOrResetPlayState(userId);
                location.href = 'game.html';
            } catch (err) {
                alert(err.message);
            }
        });
    </script>
</body>
</html>
