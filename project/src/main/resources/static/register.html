<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>침연시 - 회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h1 class="page-title">회원가입</h1>
        <p class="page-subtitle">새 계정을 만들어보세요</p>

        <div id="alert" class="alert hidden"></div>

        <form id="registerForm">
            <div class="form-group">
                <label class="form-label">이메일</label>
                <div style="display:flex; gap:0.5rem;">
                    <input type="email" id="email" class="form-input" placeholder="example@email.com" required
                           style="flex:1;">
                    <button type="button" id="checkEmailBtn" class="btn btn-secondary btn-sm" style="flex-shrink:0;">
                        중복확인
                    </button>
                </div>
                <p id="emailMsg" class="text-sm mt-1 hidden"></p>
            </div>

            <div class="form-group">
                <label class="form-label">닉네임</label>
                <input type="text" id="nickname" class="form-input" placeholder="닉네임 입력" required maxlength="50">
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" id="password" class="form-input" placeholder="비밀번호 입력" required>
            </div>

            <div class="form-group">
                <label class="form-label">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" class="form-input" placeholder="비밀번호 재입력" required>
            </div>

            <button type="submit" class="btn btn-primary mt-4">가입하기</button>
        </form>

        <hr class="divider">

        <p class="text-center text-muted">
            이미 계정이 있으신가요?
            <a href="index.html" class="link">로그인</a>
        </p>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if (Auth.isLoggedIn()) location.href = 'menu.html';

        let emailAvailable = false;

        document.getElementById('checkEmailBtn').addEventListener('click', async () => {
            const email   = document.getElementById('email').value.trim();
            const msgEl   = document.getElementById('emailMsg');
            if (!email) return;

            try {
                const data = await api.checkEmail(email);
                emailAvailable = data.available;
                msgEl.textContent  = data.available ? '사용 가능한 이메일입니다.' : '이미 사용 중인 이메일입니다.';
                msgEl.className    = `text-sm mt-1 ${data.available ? 'alert-success' : 'alert-error'}`;
                msgEl.classList.remove('hidden');
            } catch {
                msgEl.textContent = '확인 중 오류가 발생했습니다.';
                msgEl.className   = 'text-sm mt-1 alert-error';
                msgEl.classList.remove('hidden');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertEl = document.getElementById('alert');
            alertEl.classList.add('hidden');

            const email           = document.getElementById('email').value.trim();
            const nickname        = document.getElementById('nickname').value.trim();
            const password        = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;

            if (!emailAvailable) {
                alertEl.textContent = '이메일 중복 확인을 먼저 해주세요.';
                alertEl.className   = 'alert alert-error';
                alertEl.classList.remove('hidden');
                return;
            }
            if (password !== passwordConfirm) {
                alertEl.textContent = '비밀번호가 일치하지 않습니다.';
                alertEl.className   = 'alert alert-error';
                alertEl.classList.remove('hidden');
                return;
            }

            try {
                await api.register({ email, nickname, password });
                alertEl.textContent = '회원가입이 완료되었습니다! 로그인해주세요.';
                alertEl.className   = 'alert alert-success';
                alertEl.classList.remove('hidden');
                setTimeout(() => location.href = 'index.html', 1500);
            } catch (err) {
                alertEl.textContent = err.message;
                alertEl.className   = 'alert alert-error';
                alertEl.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
